<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Nota Pembelian | Toko Sembako</title><style>
        :root {
            --ink: #111827;
            --muted: #6b7280;
            --line: #d1d5db;
            --primary: #2563eb;
            --green: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 30rem),
                radial-gradient(circle at bottom right, rgba(22,163,74,.14), transparent 28rem),
                #eef5ff;
        }
        .screen-wrap {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }
        .toolbar {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(15,23,42,.10);
            padding: 24px;
        }
        .toolbar h1 {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: -.04em;
        }
        .toolbar p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }
        .toolbar .btns {
            display: grid;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 12px 15px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 8px 18px rgba(37,99,235,.22);
        }
        .btn.green { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 8px 18px rgba(22,163,74,.20); }
        .btn.gray { background: linear-gradient(135deg, #475569, #64748b); box-shadow: 0 8px 18px rgba(71,85,105,.20); }
        .nota-preview {
            display: grid;
            place-items: start center;
        }
        .receipt {
            width: 80mm;
            min-height: 120mm;
            background: #fff;
            border-radius: 18px;
            padding: 18px 16px;
            box-shadow: 0 22px 60px rgba(15,23,42,.18);
            font-family: "Consolas", "Courier New", monospace;
            color: #000;
        }
        .receipt h2 {
            margin: 0;
            text-align: center;
            font-size: 17px;
            letter-spacing: .04em;
        }
        .receipt .store-info {
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
            margin-top: 4px;
        }
        .line {
            border-top: 1px dashed #000;
            margin: 10px 0;
        }
        .meta {
            font-size: 11px;
            line-height: 1.55;
        }
        .meta-row {
            display: grid;
            grid-template-columns: 82px 1fr;
            gap: 6px;
        }
        .item {
            font-size: 11px;
            margin-bottom: 8px;
        }
        .item-name {
            font-weight: 700;
            line-height: 1.35;
        }
        .item-calc {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 2px;
        }
        .totals {
            font-size: 12px;
            line-height: 1.75;
        }
        .total-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }
        .total-row.grand {
            font-size: 14px;
            font-weight: 900;
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
            padding: 5px 0;
            margin: 5px 0;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 12px;
        }
        .barcode {
            text-align: center;
            font-size: 22px;
            letter-spacing: 2px;
            margin-top: 8px;
        }
       @media print {
    @page {
        size: 80mm 297mm;
        margin: 0;
    }

    html,
    body {
        width: 80mm;
        margin: 0;
        padding: 0;
        background: #fff;
    }

    .screen-wrap {
        display: block;
        width: 80mm;
        margin: 0;
        padding: 0;
    }

    .toolbar {
        display: none !important;
    }

    .nota-preview {
        display: block;
        width: 80mm;
        margin: 0;
        padding: 0;
    }

    .receipt {
        width: 72mm;
        min-height: 0;
        margin: 0 auto;
        padding: 4mm;
        border-radius: 0;
        box-shadow: none;
    }
}
        @media (max-width: 840px) {
            .screen-wrap { grid-template-columns: 1fr; }
            .toolbar { order: 2; }
            .nota-preview { order: 1; }
        }
    

/* RESPONSIVE NOTA V23: desktop, iPad, Android, iPhone */
@media (max-width: 900px) {
    body {
        padding: 14px;
        place-items: start center;
    }
    .screen-wrap {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    .toolbar {
        padding: 18px;
        border-radius: 22px;
    }
    .toolbar h1 {
        font-size: 24px;
    }
    .nota-preview {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        justify-content: center;
    }
    .receipt {
        flex: 0 0 auto;
    }
}
@media (max-width: 560px) {
    body {
        padding: 10px;
    }
    .toolbar {
        padding: 15px;
        border-radius: 18px;
    }
    .toolbar h1 {
        font-size: 21px;
    }
    .toolbar p {
        font-size: 13px;
    }
    .btn {
        min-height: 44px;
        font-size: 13px;
    }
    .nota-preview {
        justify-content: flex-start;
    }
    .receipt {
        width: 80mm;
        max-width: none;
    }
}
@media print {
    .screen-wrap,
    .nota-preview,
    .receipt {
        width: 80mm !important;
        max-width: 80mm !important;
    }
}

function load(){let d=localStorage.getItem(dbKey);if(!d){d=seed();save(d);return d}try{return JSON.parse(d)}catch(e){d=seed();save(d);return d}}
function save(d){localStorage.setItem(dbKey,JSON.stringify(d))}
function nextId(a){return Math.max(0,...a.map(x=>Number(x.id)||0))+1}
function currentUser(){try{return JSON.parse(sessionStorage.getItem('sembakoUser')||'null')}catch(e){return null}}
function setUser(u){sessionStorage.setItem('sembakoUser',JSON.stringify(u))}
function logout(){sessionStorage.removeItem('sembakoUser')}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function alertBox(type,msg){return `<div class="alert alert-${type}">${msg}</div>`}
function getKasir(id,d=load()){return d.users.find(u=>Number(u.id)===Number(id))||{} }
function getBarang(id,d=load()){return d.barang.find(b=>Number(b.id)===Number(id))||{} }
function getSupplier(id,d=load()){return d.supplier.find(s=>Number(s.id)===Number(id))||{} }
function isToday(t){return String(t||'').slice(0,10)===today()}
function filteredPenjualan(d){const u=currentUser();let arr=[...d.penjualan]; if(u?.role==='kasir') arr=arr.filter(p=>Number(p.kasir_id)===Number(u.id)); return arr.sort((a,b)=>b.id-a.id)}
function detailRows(d){let ps=filteredPenjualan(d);let allowed=new Set(ps.map(p=>p.id));return d.detail_penjualan.filter(x=>allowed.has(x.penjualan_id)).map(x=>{let p=d.penjualan.find(p=>p.id===x.penjualan_id)||{};let b=getBarang(x.barang_id,d);let u=getKasir(p.kasir_id,d);return {...x,no_faktur:p.no_faktur,tanggal:p.tanggal,nama_kasir:u.nama,kode_barang:b.kode_barang,nama_barang:b.nama_barang,satuan:b.satuan}}).sort((a,b)=>b.id-a.id)}
function setHeader(){const u=currentUser();if(!u)return; q('[data-user-avatar]')&&(q('[data-user-avatar]').textContent=(u.nama||'A').slice(0,1).toUpperCase());q('[data-user-name]')&&(q('[data-user-name]').textContent=u.nama);q('[data-user-role]')&&(q('[data-user-role]').textContent=u.role.toUpperCase());q('[data-current-role]')&&(q('[data-current-role]').textContent=u.role.toUpperCase());q('[data-date-pill]')&&(q('[data-date-pill]').textContent=dateText());q('[data-footer-year]')&&(q('[data-footer-year]').textContent='© '+new Date().getFullYear()+' Toko Karunia Berkah');qa('[data-role-menu="admin"]').forEach(a=>{if(u.role!=='admin')a.remove()})}
function guard(page){if(['login','forgot','nota'].includes(page))return true;let u=currentUser();if(!u){location.href='index.html';return false}return true}
function noAccess(){location.href='dashboard.html?error=akses'}
function parseUnit(s){let m=String(s||'1 Kg').match(/^([0-9.,]+)\s+(.+)$/);return m?[m[1].replace(',','.'),m[2]]:['1',s||'Kg']}
function nextKode(d){let n=Math.max(0,...d.barang.map(b=>Number(String(b.kode_barang).replace(/\D/g,''))||0))+1;return 'BRG'+String(n).padStart(3,'0')}

a href="penjualan.html">🛒 Transaksi Baru <span>Input penjualan</span></a><a href="detail_penjualan.html">🧾 Detail Transaksi <span>Rincian barang terjual</span></a>${roleAdmin?'<a href="laporan_penjualan.html">📊 Cetak Penjualan <span>Laporan transaksi</span></a><a href="barang.html">📦 Kelola Barang <span>Stok dan harga</span></a>':''}</div></div></div>`}
function renderBarang(editId=null,msg=''){let d=load(); if(currentUser().role!=='admin')return noAccess(); let edit=d.barang.find(b=>b.id==editId);let data=[...d.barang].sort((a,b)=>a.kode_barang.localeCompare(b.kode_barang));let totalStok=d.barang.reduce((s,b)=>s+Number(b.stok),0);let stokMenipis=d.barang.filter(b=>b.stok<=5).length;let nilai=d.barang.reduce((s,b)=>s+b.harga_jual*b.stok,0);let satuan=['Kg','Gram','Pcs','Slp','Liter','Ml','Botol','Bungkus','Dus','Sak','Pack','Kaleng','Kotak','Renteng'];let [isi,unit]=parseUnit(edit?.satuan);pageEl().innerHTML=`<div class="page-title page-title-inventory"><div><h1>Form Barang</h1><p class="page-subtitle">Kelola stok, harga, supplier, dan kode barang secara berurutan.</p></div><a class="btn btn-print" href="laporan_barang.html">Cetak Laporan</a></div>${msg}${new URLSearchParams(location.search).get('error')==='barang_dipakai'?alertBox('error','⚠️ Barang tidak bisa dihapus karena sudah pernah digunakan dalam transaksi penjualan.'):''}<div class="inventory-hero"><div class="inventory-hero-copy"><span class="inventory-badge">📦 Inventory Barang</span><h2>Kode barang kini tampil berurutan.</h2><p>Data barang ditampilkan dari kode terkecil ke terbesar. Saat tambah barang baru, kode otomatis disiapkan agar tidak tertukar.</p></div><div class="inventory-mini-stats"><div><span>Total Barang</span><strong data-counter>${d.barang.length}</strong></div><div><span>Total Stok</span><strong data-counter>${totalStok}</strong></div><div><span>Stok Menipis</span><strong data-counter>${stokMenipis}</strong></div><div><span>Nilai Stok</span><strong>${money(nilai)}</strong></div></div></div><div class="card inventory-form-card"><div class="section-head"><div><span class="section-kicker">${edit?'Edit Data Barang':'Tambah Barang Baru'}</span><h2>${edit?'Perbarui informasi barang':'Input barang ke daftar stok'}</h2></div><div class="next-code-pill">Kode aktif: <strong>${edit?edit.kode_barang:nextKode(d)}</strong></div></div><form id="barangForm"><input type="hidden" name="id" value="${edit?.id||''}"><div class="grid-3 inventory-form-grid"><div class="form-group"><label>Kode Barang</label><input type="text" name="kode_barang" class="readonly-code" value="${edit?edit.kode_barang:nextKode(d)}" readonly required><small class="field-hint">Kode dibuat otomatis agar urutan barang rapi.</small></div><div class="form-group"><label>Nama Barang</label><input type="text" name="nama_barang" value="${esc(edit?.nama_barang||'')}" placeholder="Contoh: Beras Premium 5 Kg" required></div><div class="form-group"><label>Supplier</label><select name="supplier_id"><option value="">- Pilih Supplier -</option>${d.supplier.map(s=>`<option value="${s.id}" ${edit?.supplier_id==s.id?'selected':''}>${esc(s.nama_supplier)}</option>`).join('')}</select></div><div class="form-group"><label>Isi & Satuan</label><div class="satuan-field"><input type="text" name="isi_satuan" class="unit-size-input" value="${isi}" required><select name="satuan_dasar">${satuan.map(x=>`<option ${unit===x?'selected':''}>${x}</option>`).join('')}</select></div><small class="field-hint">Contoh: 1 Kg, 200 Gram, 1 Liter.</small></div><div class="form-group"><label>Harga Beli</label><input type="text" name="harga_beli" class="rupiah-input" inputmode="numeric" value="${edit?edit.harga_beli:''}" required></div><div class="form-group"><label>Harga Jual</label><input type="text" name="harga_jual" class="rupiah-input" inputmode="numeric" value="${edit?edit.harga_jual:''}" required></div><div class="form-group"><label>Stok</label><input type="number" name="stok" value="${edit?.stok||''}" required></div></div><button type="submit">${edit?'Update Barang':'Simpan Barang'}</button>${edit?' <button type="button" class="btn btn-secondary" onclick="location.href=\'barang.html\'">Batal</button>':''}</form></div><div class="card inventory-table-card"><div class="table-scroll-hint no-print">Geser tabel ke samping untuk melihat harga, stok, dan aksi.</div><div class="table-wrap inventory-table-scroll"><table class="inventory-table"><thead><tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>Supplier</th><th>Satuan</th><th>Harga Beli</th><th>Harga Jual</th><th>Stok</th><th>Aksi</th></tr></thead><tbody>${data.map((b,i)=>{let dipakai=d.detail_penjualan.some(x=>x.barang_id==b.id);return `<tr><td>${i+1}</td><td><span class="code-badge">${b.kode_barang}</span></td><td><strong>${esc(b.nama_barang)}</strong></td><td>${esc(getSupplier(b.supplier_id,d).nama_supplier||'-')}</td><td>${esc(b.satuan)}</td><td>${money(b.harga_beli)}</td><td>${money(b.harga_jual)}</td><td><span class="stock-badge ${b.stok<=5?'danger':b.stok<=15?'warning':'safe'}">${b.stok}</span></td><td class="actions"><button class="btn btn-secondary" data-edit-barang="${b.id}">Edit</button>${dipakai?'<span class="btn btn-secondary">Terkunci</span>':`<button class="btn btn-danger" data-del-barang="${b.id}">Hapus</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`;q('#barangForm').onsubmit=e=>{e.preventDefault();let f=formData(e.target);let satuan=(f.isi_satuan||'1')+' '+f.satuan_dasar;let payload={id:f.id?Number(f.id):nextId(d.barang),kode_barang:f.kode_barang,nama_barang:f.nama_barang,supplier_id:f.supplier_id?Number(f.supplier_id):null,satuan,harga_beli:Number((f.harga_beli||'').replace(/\D/g,'')),harga_jual:Number((f.harga_jual||'').replace(/\D/g,'')),stok:Number(f.stok||0)};if(f.id){let ix=d.barang.findIndex(x=>x.id==f.id);d.barang[ix]=payload}else d.barang.push(payload);save(d);renderBarang(null,alertBox('success','✅ Data barang berhasil diproses.'))};qa('[data-edit-barang]').forEach(b=>b.onclick=()=>renderBarang(b.dataset.editBarang));qa('[data-del-barang]').forEach(b=>b.onclick=()=>{if(confirm('Hapus data ini?')){let id=Number(b.dataset.delBarang);d.barang=d.barang.filter(x=>x.id!==id);save(d);renderBarang(null,alertBox('success','✅ Data barang berhasil dihapus.'))}})}

class="card"><h2>Riwayat Penjualan</h2><div class="table-wrap"><table><thead><tr><th>No</th><th>No Faktur</th><th>Tanggal</th><th>Nama Kasir</th><th>Total</th><th>Bayar</th><th>Kembali</th><th>Aksi</th></tr></thead><tbody>${ps.slice(0,20).map((p,i)=>`<tr><td>${i+1}</td><td>${p.no_faktur}</td><td>${p.tanggal}</td><td>${esc(getKasir(p.kasir_id,d).nama)}</td><td>${money(p.total)}</td><td>${money(p.bayar)}</td><td>${money(p.kembali)}</td><td><a class="btn btn-print" href="nota.html?id=${p.id}">Cetak Nota</a></td></tr>`).join('')||'<tr><td colspan="8">Belum ada riwayat penjualan.</td></tr>'}</tbody></table></div></div><style>.sales-item-grid{align-items:start}.barang-search-field{grid-column:span 2}.add-item-group{align-self:end}.barang-combobox{position:relative}.barang-combobox input{padding-right:48px}.barang-clear{position:absolute;right:8px;top:7px;width:34px;min-height:34px;padding:0;border-radius:12px;background:#eef2ff;color:#1d4ed8;box-shadow:none}.barang-suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:50;max-height:292px;overflow:auto;border:1px solid rgba(148,163,184,.34);border-radius:18px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.18);padding:8px}.barang-suggestions.show{display:block}.barang-option{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;margin:0 0 6px;padding:12px 13px;text-align:left;border:1px solid rgba(226,232,240,.95);border-radius:15px;background:linear-gradient(180deg,#fff,#f8fbff);color:#172033;box-shadow:none}.barang-option:hover,.barang-option:focus{border-color:rgba(37,99,235,.45);background:#eff6ff;transform:none}.barang-option strong{display:block;font-size:14px}.barang-option small{display:block;margin-top:4px;color:#64748b;font-weight:750}.barang-option span{align-self:center;font-weight:950;color:#047857;white-space:nowrap}.barang-empty{padding:12px 13px;color:#64748b;font-weight:750}.barang-preview{margin-top:9px;padding:10px 12px;border-radius:14px;background:#f8fafc let items=[],total=0,selectedBarang=null;
let input=q('#cariBarang'),suggest=q('#barangSuggest'),preview=q('#barangPreview'),hidden=q('#pilihBarang'),clearBtn=q('#clearBarangBtn');
function matchBarang(b,term){term=String(term||'').toLowerCase();return [b.kode_barang,b.nama_barang,b.satuan,b.harga_jual,b.stok].some(v=>String(v??'').toLowerCase().includes(term))}
function optionHtml(b){return `<button type="button" class="barang-option" data-pick-barang="${b.id}"><div><strong>${esc(b.kode_barang)} - ${esc(b.nama_barang)}</strong><small>${esc(b.satuan)} • ${money(b.harga_jual)} • Stok ${b.stok}</small></div><span>Pilih</span></button>`}
function showPreview(b){preview.innerHTML=b?`<strong>${esc(b.kode_barang)} - ${esc(b.nama_barang)}</strong><br><span>${esc(b.satuan)} • Stok ${b.stok}</span> • <span class="preview-price">${money(b.harga_jual)}</span>`:'Belum ada barang dipilih.'}
function renderSuggest(keyword='',force=false){let term=String(keyword||'').trim();if(!force&&!term){suggest.classList.remove('show');return}let rows=(term?barangList.filter(b=>matchBarang(b,term)):barangList).slice(0,12);suggest.innerHTML=rows.length?rows.map(optionHtml).join(''):`<div class="barang-empty">Barang tidak ditemukan atau stok kosong.</div>`;suggest.classList.add('show');qa('[data-pick-barang]',suggest).forEach(btn=>btn.onclick=()=>selectBarang(btn.dataset.pickBarang))}
function selectBarang(id){let b=barangList.find(x=>Number(x.id)===Number(id));if(!b)return;selectedBarang=b;hidden.value=b.id;input.value=`${b.kode_barang} - ${b.nama_barang}`;showPreview(b);suggest.classList.remove('show');q('#jumlah').focus()}
function resetBarang(){selectedBarang=null;hidden.value='';input.value='';showPreview(null);suggest.classList.remove('show')}
function cartQty(id){return items.filter(x=>Number(x.barang_id)===Number(id)).reduce((s,x)=>s+Number(x.qty),0)}
function draw(){total=items.reduce((s,it)=>s+Number(it.subtotal),0);q('#tabelItem tbody').innerHTML=items.length?items.map((it,i)=>`<tr><td><strong>${esc(it.kode)}</strong> - ${esc(it.nama)} <span class="item-unit-badge">${esc(it.satuan)}</span><input type="hidden" name="barang_id[]" value="${it.barang_id}"></td><td>${money(it.harga_jual)}</td><td>${it.qty}<input type="hidden" name="qty[]" value="${it.qty}"></td><td>${money(it.subtotal)}</td><td><button type="button" class="btn btn-danger" data-rm-item="${i}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="5">Belum ada item transaksi.</td></tr>';q('#grandTotal').textContent=money(total);qa('[data-rm-item]').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.rmItem),1);draw()})}
input.addEventListener('input',()=>{selectedBarang=null;hidden.value='';showPreview(null);renderSuggest(input.value,true)});
input.addEventListener('focus',()=>renderSuggest(input.value,true));
input.addEventListener('keydown',e=>{if(e.key==='Enter'){let first=q('[data-pick-barang]',suggest);if(first){e.preventDefault();first.click()}}});
clearBtn.onclick=()=>{resetBarang();suggest.innerHTML='';input.blur()};
document.addEventListener('click',e=>{if(!q('#barangCombo')?.contains(e.target))suggest.classList.remove('show')});
q('#tambahItemBtn').onclick=()=>{let barang=selectedBarang||barangList.find(b=>Number(b.id)===Number(hidden.value));if(!barang&&input.value.trim()){let found=barangList.filter(b=>matchBarang(b,input.value.trim()));if(found.length===1){barang=found[0];selectBarang(barang.id)}}if(!barang)return alert('Cari dan pilih barang terlebih dahulu.');let qty=Number(q('#jumlah').value||0);if(qty<=0)return alert('Jumlah harus lebih dari 0.');let sisa=Number(barang.stok)-cartQty(barang.id);if(sisa<=0)return alert('Stok barang ini sudah habis di keranjang transaksi.');if(qty>sisa)return alert('Jumlah melebihi stok tersedia. Sisa stok yang bisa ditambahkan: '+sisa);let existing=items.find(x=>Number(x.barang_id)===Number(barang.id));if(existing){existing.qty+=qty;existing.subtotal=existing.qty*existing.harga_jual}else{items.push({barang_id:Number(barang.id),kode:barang.kode_barang,nama:barang.nama_barang,satuan:barang.satuan,harga_jual:Number(barang.harga_jual),qty,subtotal:Number(barang.harga_jual)*qty})}draw();resetBarang();q('#jumlah').value=1;input.focus()};
q('#formPenjualan').onsubmit=e=>{e.preventDefault();if(!items.length)return alert('Tambahkan minimal satu item transaksi.');let bayar=Number((q('#bayar').value||'').replace(/\D/g,''));if(bayar<total){q('#jual-alert').innerHTML=alertBox('error','Uang bayar kurang dari total transaksi.');return}let id=nextId(d.penjualan),tgl=nowStr(),no='TRX-'+tgl.replace(/\D/g,'');d.penjualan.push({id,no_faktur:no,tanggal:tgl,kasir_id:u.id,total,bayar,kembali:bayar-total});items.forEach(it=>{d.detail_penjualan.push({id:nextId(d.detail_penjualan),penjualan_id:id,barang_id:it.barang_id,harga_jual:it.harga_jual,qty:it.qty,subtotal:it.subtotal});let b=d.barang.find(x=>Number(x.id)===Number(it.barang_id));if(b)b.stok=Number(b.stok)-Number(it.qty)});save(d);location.href='nota.html?id='+id+'&auto=1'};
}
function renderDetail(){let d=load(),u=currentUser();let rows=detailRows(d);pageEl().innerHTML=`<div class="page-title"><h1>Detail Penjualan / Transaksi</h1>${u.role==='admin'?'<a class="btn btn-print" href="laporan_detail_penjualan.html">Cetak Laporan</a>':''}</div><div class="card"><table><thead><tr><th>No</th><th>No Faktur</th><th>Tanggal</th><th>Nama Kasir</th><th>Kode Barang</th><th>Nama Barang</th><th>Harga</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.no_faktur}</td><td>${r.tanggal}</td><td>${esc(r.nama_kasir)}</td><td>${esc(r.kode_barang)}</td><td>${esc(r.nama_barang)}</td><td>${money(r.harga_jual)}</td><td>${r.qty}</td><td>${money(r.subtotal)}</td></tr>`).join('')||'<tr><td colspan="9">Belum ada detail transaksi.</td></tr>'}</tbody></table></div>`}
function reportHeader(title,extra=''){let u=currentUser();return `<div class="report-header"><h2>${title}</h2>${extra}<p>Dicetak oleh ${esc(u.nama)} pada ${nowStr().slice(0,16)}</p></div>`}
function renderReport(type){let d=load(),u=currentUser(); if(u.role!=='admin')return noAccess();let titleMap={laporan_barang:'Laporan Barang',laporan_supplier:'Laporan Supplier',laporan_kasir:'Laporan Kasir',laporan_penjualan:'Laporan Penjualan',laporan_detail_penjualan:'Laporan Detail Transaksi'};let html=`<div class="page-title no-print"><h1>${titleMap[type]}</h1><button class="btn btn-print" onclick="window.print()">Cetak Laporan</button></div>`;if(type==='laporan_barang'){html+=`<div class="card report-print-card">${reportHeader('Laporan Data Barang Toko Sembako')}<table class="report-table"><thead><tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>Supplier</th><th>Satuan</th><th>Harga Beli</th><th>Harga Jual</th><th>Stok</th></tr></thead><tbody>${[...d.barang].sort((a,b)=>a.kode_barang.localeCompare(b.kode_barang)).map((b,i)=>`<tr><td>${i+1}</td><td>${b.kode_barang}</td><td>${esc(b.nama_barang)}</td><td>${esc(getSupplier(b.supplier_id,d).nama_supplier||'-')}</td><td>${esc(b.satuan)}</td><td>${money(b.harga_beli)}</td><td>${money(b.harga_jual)}</td><td>${b.stok}</td></tr>`).join('')}</tbody></table><div class="report-print-footer">© ${new Date().getFullYear()} Toko Karunia Berkah • Sistem Informasi Penjualan Toko Sembako</div></div>`}
else if(type==='laporan_supplier'){html+=`<div class="card report-print-card">${reportHeader('Laporan Data Supplier Toko Sembako')}<table class="report-table"><thead><tr><th>No</th><th>Nama Supplier</th><th>No. Telepon</th><th>Alamat</th></tr></thead><tbody>${d.supplier.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.nama_supplier)}</td><td>${esc(s.no_telp)}</td><td>${esc(s.alamat)}</td></tr>`).join('')}</tbody></table><div class="report-print-footer">© ${new Date().getFullYear()} Toko Karunia Berkah • Sistem Informasi Penjualan Toko Sembako</div></div>`}
else if(type==='laporan_kasir'){let rows=d.users.filter(x=>x.role==='kasir');html+=`<div class="card report-print-card">${reportHeader('Laporan Data Kasir Toko Sembako')}<table class="report-table"><thead><tr><th>No</th><th>Nama Kasir</th><th>Username</th><th>No. HP</th><th>Alamat</th><th>Status</th></tr></thead><tbody>${rows.map((k,i)=>`<tr><td>${i+1}</td><td>${esc(k.nama)}</td><td>${esc(k.username)}</td><td>${esc(k.no_hp)}</td><td>${esc(k.alamat)}</td><td>${esc(k.status)}</td></tr>`).join('')}</tbody></table><div class="report-print-footer">© ${new Date().getFullYear()} Toko Karunia Berkah • Sistem Informasi Penjualan Toko Sembako</div></div>`}
else if(type==='laporan_penjualan'){let rows=filteredPenjualan(d),total=rows.reduce((s,p)=>s+p.total,0);html+=`<div class="card no-print"><form class="filter"><div class="form-group"><label>Dari Tanggal</label><input type="date"></div><div class="form-group"><label>Sampai Tanggal</label><input type="date"></div><button type="button">Tampilkan</button><a class="btn btn-secondary" href="laporan_penjualan.html">Reset</a></form></div><div class="card report-print-card">${reportHeader('Laporan Penjualan Toko Sembako','<p>Periode: Awal s.d. Akhir</p>')}<table class="report-table"><thead><tr><th>No</th><th>No Faktur</th><th>Tanggal</th><th>Nama Kasir</th><th>Total</th><th>Bayar</th><th>Kembali</th><th class="no-print">Nota</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${p.no_faktur}</td><td>${p.tanggal}</td><td>${esc(getKasir(p.kasir_id,d).nama)}</td><td>${money(p.total)}</td><td>${money(p.bayar)}</td><td>${money(p.kembali)}</td><td class="no-print"><a class="btn btn-print" href="nota.html?id=${p.id}">Nota</a></td></tr>`).join('')}<tr><th colspan="4">Total Penjualan</th><th>${money(total)}</th><th colspan="2"></th><th class="no-print"></th></tr></tbody></table><div class="report-print-footer">© ${new Date().getFullYear()} Toko Karunia Berkah • Sistem Informasi Penjualan Toko Sembako</div></div>`}
else {let rows=detailRows(d);html+=`<div class="card report-print-card">${reportHeader('Laporan Detail Transaksi Toko Sembako')}<table class="report-table"><thead><tr><th>No</th><th>No Faktur</th><th>Tanggal</th><th>Nama Kasir</th><th>Kode Barang</th><th>Nama Barang</th><th>Harga</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.no_faktur}</td><td>${r.tanggal}</td><td>${esc(r.nama_kasir)}</td><td>${esc(r.kode_barang)}</td><td>${esc(r.nama_barang)}</td><td>${money(r.harga_jual)}</td><td>${r.qty}</td><td>${money(r.subtotal)}</td></tr>`).join('')}</tbody></table><div class="report-print-footer">© ${new Date().getFullYear()} Toko Karunia Berkah • Sistem Informasi Penjualan Toko Sembako</div></div>`}pageEl().innerHTML=html}
function renderNota(){let d=load(),id=Number(new URLSearchParams(location.search).get('id')||0),p=d.penjualan.find(x=>x.id===id);if(!p){q('#nota-root').innerHTML='<h2>Nota tidak ditemukan.</h2>';return}let u=getKasir(p.kasir_id,d),rows=d.detail_penjualan.filter(x=>x.penjualan_id===id).map(x=>({...x,...getBarang(x.barang_id,d)}));q('#nota-root').innerHTML=`<div class="screen-wrap"><aside class="toolbar"><h1>Nota Pembelian</h1><p>Transaksi berhasil dibuat. Cetak struk ini untuk diberikan kepada pembeli.</p><div class="btns"><button class="btn green" onclick="window.print()">🖨️ Cetak Nota</button><a class="btn" href="penjualan.html">🛒 Transaksi Baru</a><a class="btn gray" href="detail_penjualan.html">📑 Detail Transaksi</a></div></aside><main class="nota-preview"><section class="receipt"><h2>TOKO KARUNIA BERKAH</h2><div class="store-info">Sistem Informasi Penjualan<br>Telp: 0812-0000-0000<br>Terima kasih sudah berbelanja</div><div class="line"></div><div class="meta"><div class="meta-row"><span>No Faktur</span><span>: ${p.no_faktur}</span></div><div class="meta-row"><span>Tanggal</span><span>: ${p.tanggal}</span></div><div class="meta-row"><span>Kasir</span><span>: ${esc(u.nama)}</span></div></div><div class="line"></div>${rows.map(r=>`<div class="item"><div class="item-name">${esc(r.nama_barang)}</div><div class="item-calc"><span>${r.qty} ${esc(r.satuan)} x ${money(r.harga_jual)}</span><strong>${money(r.subtotal)}</strong></div></div>`).join('')}<div class="line"></div><div class="totals"><div class="total-row grand"><span>TOTAL</span><span>${money(p.total)}</span></div><div class="total-row"><span>Bayar</span><span>${money(p.bayar)}</span></div><div class="total-row"><span>Kembali</span><span>${money(p.kembali)}</span></div></div><div class="line"></div><div class="footer-note">Barang yang sudah dibeli<br>tidak dapat dikembalikan.<br>*** Terima Kasih ***</div><div class="barcode">||||||||||||</div></section></main></div>`;if(new URLSearchParams(location.search).has('auto'))setTimeout(()=>window.print(),450)}
function loginInit(){load();let form=q('[data-login-form]');if(!form)return;form.onsubmit=e=>{e.preventDefault();let d=load(),f=formData(form),u=d.users.find(x=>x.username===f.username&&x.password===f.password&&x.status==='aktif');if(!u){q('#login-alert').innerHTML=alertBox('error','Username atau password salah.');return}setUser({id:u.id,nama:u.nama,role:u.role,username:u.username});sessionStorage.setItem('showAppLoader','login');location.href='dashboard.html'}}
function forgotInit(){load();let form=q('[data-forgot-form]');if(!form)return;form.onsubmit=e=>{e.preventDefault();let d=load(),f=formData(form),el=q('#forgot-alert');if(!f.username||!f.password_baru||!f.konfirmasi_password){el.innerHTML='<div class="alert error">Semua data wajib diisi.</div>';return}if(f.password_baru!==f.konfirmasi_password){el.innerHTML='<div class="alert error">Konfirmasi password tidak sama.</div>';return}let u=d.users.find(x=>x.username===f.username);if(!u){el.innerHTML='<div class="alert error">Username tidak ditemukan.</div>';return}u.password=f.password_baru;save(d);sessionStorage.setItem('showAppLoader','forgot');el.innerHTML='<div class="alert success">Password berhasil diperbarui. Silakan login kembali.</div>';setTimeout(()=>location.href='index.html',900)}}

main();
